<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101828">
<title>管理后台 · 释然团队</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="loginView" class="login-wrap">
  <div class="login-box">
    <h2>释然团队</h2>
    <p class="sub">管理员登录</p>
    <div class="f"><label>管理员账号</label><input id="lgUser" placeholder="admin" autocomplete="username"></div>
    <div class="f"><label>密码</label><input id="lgPwd" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="btn" id="lgBtn">登 录</button>
    <div class="hint" style="text-align:center;margin-top:16px">
      默认账号 <code class="inl">admin</code> / <code class="inl">admin888</code>
    </div>
  </div>
</div>

<!-- ============ 主体 ============ -->
<div class="wrap" id="appView" style="display:none">
  <div class="side-mask"></div>
  <aside class="side">
    <div class="logo"><i>C</i><span>释然团队</span></div>
    <nav id="nav"></nav>
    <div class="foot" id="sideFoot">v1.0</div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="burger" aria-label="菜单"><span></span><span></span><span></span></button>
      <h1 id="pageTitle">概览</h1>
      <div class="u">
        <span class="uname" id="whoami">-</span>
        <button class="btn ghost sm" id="btnLogout">退出</button>
      </div>
    </header>
    <div class="body" id="pageBody"></div>
  </div>
</div>

<script src="local-db.js"></script>
<script>
/* ==== common.js 内联（避免外部加载失败） ==== */
/* 公共 JS —— 请求封装 / 提示 / 工具 / 手机菜单 */
const API = '';

function toast(msg, type = '') {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'on ' + type;
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = type; el.style.opacity = 0; }, 2800);
}

function tokenGet(k) { return localStorage.getItem(k); }
function tokenSet(k, v) { localStorage.setItem(k, v); }
function tokenDel(k) { localStorage.removeItem(k); }

async function req(url, opt = {}, tokenKey = 'adm_token') {
  const headers = { 'Content-Type': 'application/json', ...(opt.headers || {}) };
  const t = tokenGet(tokenKey);
  if (t) headers.Authorization = 'Bearer ' + t;
  let res;
  try {
    res = await fetch(API + url, {
      method: opt.method || (opt.body ? 'POST' : 'GET'),
      headers,
      body: opt.body ? JSON.stringify(opt.body) : undefined,
    });
  } catch (e) {
    toast('网络错误，请检查服务是否在运行', 'err');
    throw e;
  }
  if (res.status === 401) {
    tokenDel(tokenKey);
    toast('登录已失效，请重新登录', 'err');
    setTimeout(() => { location.href = tokenKey === 'adm_token' ? 'admin.html' : 'agent.html'; }, 900);
    throw new Error('未登录');
  }
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('json')) return await res.text();
  const j = await res.json();
  if (opt.raw) return j;
  if (j.code !== 0) { toast(j.msg || '操作失败', 'err'); throw new Error(j.msg || 'failed'); }
  return j;
}

function $(s, r = document) { return r.querySelector(s); }
function $$(s, r = document) { return Array.from(r.querySelectorAll(s)); }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtTime(ms) {
  if (!ms) return '-';
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function statusTag(st) {
  const m = {
    unused: ['未使用', 'wait'], used: ['已使用', 'ok'],
    expired: ['已过期', 'off'], disabled: ['已封禁', 'err'],
    pending: ['待审核', 'warn'], paid: ['已打款', 'ok'], rejected: ['已驳回', 'err'],
  };
  const [t, c] = m[st] || [st, 'off'];
  return `<span class="tag ${c}">${t}</span>`;
}

function copy(text) {
  const done = () => toast('已复制到剪贴板', 'ok');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { toast('复制失败，请长按手动选择', 'err'); }
    document.body.removeChild(ta);
  }
}

function download(filename, content, type = 'text/plain;charset=utf-8') {
  const blob = new Blob(['\ufeff' + content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

/* 手机侧边栏 */
function initMobileNav() {
  const side = $('.side'), mask = $('.side-mask'), bg = $('.burger');
  if (!side || !bg) return;
  const close = () => { side.classList.remove('open'); mask && mask.classList.remove('on'); };
  bg.onclick = () => { side.classList.toggle('open'); mask && mask.classList.toggle('on'); };
  mask && (mask.onclick = close);
  $A('.side nav a').forEach(a => a.addEventListener('click', close));
}

function sideNav(items, active) {
  return items.map(([id, icon, name]) => `
    <a href="#${id}" data-tab="${id}" class="${id === active ? 'on' : ''}">
      <span>${icon}</span><em style="font-style:normal">${name}</em>
    </a>`).join('');
}

function openModal(title, bodyHtml, footHtml) {
  let m = document.getElementById('__modal');
  if (!m) {
    m = document.createElement('div');
    m.id = '__modal';
    m.className = 'mask';
    m.innerHTML = `<div class="modal">
      <div class="mh"><h3></h3><button class="x">&times;</button></div>
      <div class="mb"></div><div class="mf"></div></div>`;
    document.body.appendChild(m);
    m.querySelector('.x').onclick = closeModal;
    m.onclick = e => { if (e.target === m) closeModal(); };
  }
  m.querySelector('.mh h3').textContent = title;
  m.querySelector('.mb').innerHTML = bodyHtml;
  m.querySelector('.mf').innerHTML = footHtml || '';
  m.classList.add('on');
  return m;
}
function closeModal() {
  const m = document.getElementById('__modal');
  if (m) m.classList.remove('on');
}

/* 记录当前页签，刷新后保持 */
function tabRemember(key, def) {
  const h = (location.hash || '').replace('#', '');
  return h || sessionStorage.getItem(key) || def;
}
function tabSet(key, id) { sessionStorage.setItem(key, id); }

</script>
<script>
/* =========================================================
 *  全局
 * ========================================================= */
const NAV = [
  ['dash',   '▤', '概览'],
  ['apps',   '▣', '应用管理'],
  ['cards',  '▦', '卡密管理'],
  ['gen',    '＋', '卡密生成'],
  ['gencredit', '◉', '额度卡生成'],
  ['users',  '☺', '用户额度'],
  ['agents', '⚑', '代理商'],
  ['logs',   '☰', '验证日志'],
  ['apidoc', '⌗', '对接文档'],
  ['setting','⚙', '系统设置'],
];
let TYPES = [];
let APPS = [];

/* 兜底：确保 $ / $$ / $Q / $A 四个选择器函数都可用 */
window.$ = window.$ || ((s, r) => (r || document).querySelector(s));
window.$$ = window.$$ || ((s, r) => Array.from((r || document).querySelectorAll(s)));
const $Q = (s, r) => (r || document).querySelector(s);
const $A = (s, r) => Array.from((r || document).querySelectorAll(s));
let CUR = 'dash';

/* =========================================================
 *  登录
 * ========================================================= */
function bindLogin() {
  const u = $('#lgUser'), p = $('#lgPwd'), b = $('#lgBtn');
  if (!u || !p || !b) return;
  u.addEventListener('keydown', e => { if (e.key === 'Enter') p.focus(); });
  p.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  b.onclick = doLogin;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bindLogin);
} else {
  bindLogin();
}

async function doLogin() {
  const userEl = $('#lgUser'), pwdEl = $('#lgPwd');
  // 容错：去掉所有空白（含全角空格、不间断空格），防止中文输入法带进来的空格
  const rawUser = (userEl && userEl.value) || '';
  const rawPwd = (pwdEl && pwdEl.value) || '';
  const username = rawUser.replace(/[\s\u3000\u00A0]+/g, '').trim();
  const password = rawPwd.trim();

  if (!username || !password) {
    // 明确指出缺哪一项，避免用户困惑
    const miss = [];
    if (!username) miss.push('账号');
    if (!password) miss.push('密码');
    return toast('请填写' + miss.join('和'), 'err');
  }

  const btn = $('#lgBtn');
  if (btn) { btn.disabled = true; btn.textContent = '登录中...'; }
  try {
    const j = await req('/api/admin/login', { body: { username, password } }, 'nokey');
    tokenSet('adm_token', j.token);
    tokenSet('adm_user', j.username);
    await boot();
  } catch (e) {
    // 把失败原因显示出来，而不是静默吞掉
    toast('登录失败：' + (e && e.message ? e.message : '未知错误'), 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '登 录'; }
  }
}

$('#btnLogout').onclick = () => {
  tokenDel('adm_token'); tokenDel('adm_user');
  location.reload();
};

/* =========================================================
 *  启动
 * ========================================================= */
async function boot() {
  if (!tokenGet('adm_token')) return;
  try {
    await req('/api/admin/me');
  } catch (e) { return; }
  $('#loginView').style.display = 'none';
  $('#appView').style.display = 'flex';
  $('#whoami').textContent = tokenGet('adm_user') || 'admin';
  $('#nav').innerHTML = sideNav(NAV, CUR);
  $A('#nav a').forEach(a => a.onclick = e => {
    e.preventDefault();
    go(a.dataset.tab);
  });
  initMobileNav();
  window.addEventListener('hashchange', () => {
    const t = (location.hash || '').replace('#', '');
    if (t && t !== CUR) go(t, true);
  });
  await loadTypes();
  go(tabRemember('adm_tab', 'dash'), true);
}

function go(tab, silent) {
  if (!NAV.find(n => n[0] === tab)) tab = 'dash';
  CUR = tab;
  tabSet('adm_tab', tab);
  $('#pageTitle').textContent = (NAV.find(n => n[0] === tab) || [])[2] || '';
  $A('#nav a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  if (!silent) location.hash = tab;
  window.scrollTo(0, 0);
  const el = $('#pageBody');
  el.innerHTML = '<div class="empty">加载中...</div>';
  const fn = PAGES[tab];
  if (fn) fn(el).catch(e => { el.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
}

async function loadTypes() {
  const j = await req('/api/admin/types');
  TYPES = j.list;
}

/* =========================================================
 *  页面集合
 * ========================================================= */
const PAGES = {};

/* ---------- 概览 ---------- */
PAGES.dash = async (el) => {
  const d = await req('/api/admin/stats');
  const maxV = Math.max(1, ...d.trend.map(t => t.total));
  const bars = d.trend.map(t => {
    const h = Math.round(t.total / maxV * 90) + 4;
    const fh = Math.round(t.fail / maxV * 90);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:94px;position:relative">
        <div style="height:${h}px;background:linear-gradient(180deg,#5b8cff,#2f6bff);border-radius:5px 5px 0 0;position:relative">
          ${fh ? `<div style="position:absolute;bottom:0;left:0;right:0;height:${fh}px;background:#f04438;border-radius:0 0 0 0"></div>` : ''}
        </div>
      </div>
      <div style="font-size:11px;color:var(--dim)">${t.date}</div>
      <div style="font-size:11px;color:var(--text);font-weight:600">${t.total}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
  <div class="stats">
    <div class="st b"><div class="lb">卡密总数</div><div class="vl">${d.cards_total}</div>
      <div class="sub">未使用 ${d.cards_unused} · 已用 ${d.cards_used}</div></div>
    <div class="st g"><div class="lb">VIP 生效中</div><div class="vl">${d.vip_active}</div>
      <div class="sub">总用户 ${d.users_total}</div></div>
    <div class="st o"><div class="lb">今日验证</div><div class="vl">${d.verify_today}</div>
      <div class="sub">失败 ${d.verify_fail_today} 次</div></div>
    <div class="st p"><div class="lb">累计充值额度</div><div class="vl">${d.credit_total}</div>
      <div class="sub">已消耗 ${d.credit_used}</div></div>
    <div class="st"><div class="lb">代理商</div><div class="vl">${d.agents_total}</div>
      <div class="sub">冻结 ${d.agents_frozen} 个</div></div>
    <div class="st"><div class="lb">代理余额合计</div><div class="vl" style="font-size:21px">¥${d.agent_balance_total}</div>
      <div class="sub">代理由管理员直接充余额</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="hd"><h2>近 7 天验证趋势</h2>
      <span class="hint" style="margin:0">蓝色=总请求，红色=失败</span></div>
    <div class="bd">
      <div style="display:flex;gap:8px;align-items:flex-end;padding:6px 0">${bars}</div>
    </div>
  </div>

  <div class="grid2">
    <div class="card"><div class="hd"><h2>系统状态</h2></div><div class="bd">
      <table class="tb">
        <tr><td style="color:var(--dim)">服务器时间</td><td style="text-align:right">${esc(d.server_time)}</td></tr>
        <tr><td style="color:var(--dim)">已运行</td><td style="text-align:right">${d.uptime_min} 分钟</td></tr>
        <tr><td style="color:var(--dim)">数据存储</td><td style="text-align:right">本地 SQLite</td></tr>
        <tr><td style="color:var(--dim)">卡密状态分布</td><td style="text-align:right">
          未用 ${d.cards_unused} / 已用 ${d.cards_used} / 过期 ${d.cards_expired} / 封禁 ${d.cards_disabled}
        </td></tr>
      </table>
    </div></div>
    <div class="card"><div class="hd"><h2>快捷操作</h2></div><div class="bd" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" onclick="go('gen')">批量生成卡密</button>
      <button class="btn ghost" onclick="go('agents')">管理代理商</button>
      <button class="btn ghost" onclick="go('apidoc')">查看对接文档</button>
      <button class="btn ghost" onclick="location.href='/api/admin/backup?token='+tokenGet('adm_token')">下载数据库备份</button>
    </div></div>
  </div>`;
};

/* ---------- 应用管理（多应用：每个软件独立卡密池与密钥） ---------- */
PAGES.apps = async (el) => {
  const j = await req('/api/admin/apps');
  APPS = j.list;

  el.innerHTML = `
  <div class="card" style="margin-bottom:14px">
    <div class="hd"><h2>应用列表</h2>
      <button class="btn sm" id="appAdd">＋ 新增应用</button></div>
    <div class="tbwrap" id="appTb"></div>
  </div>
  <div class="card"><div class="bd">
    <div class="hint" style="margin:0;line-height:2">
      <b>什么是多应用？</b><br>
      如果你有多个软件/工具，可以在这里为每个软件建一个「应用」。<br>
      · 每个应用有<b>独立的卡密池</b>，A 软件的卡不能用在 B 软件上<br>
      · 每个应用有<b>独立的通信密钥</b>，一个泄露不影响其他<br>
      · 每个应用可以单独设置<b>版本号、下载地址、公告</b><br>
      · 客户端对接时需要传 <code class="inl">app_id</code> 来指定自己属于哪个应用
    </div>
  </div></div>`;

  $('#appAdd').onclick = () => appEdit(null);
  renderApps();
};

function renderApps() {
  const box = $('#appTb');
  if (!APPS.length) { box.innerHTML = '<div class="empty">还没有应用</div>'; return; }
  box.innerHTML = `<table class="tb tb-mobile">
    <thead><tr>
      <th>应用标识</th><th>名称</th><th>卡密</th><th>卡类型</th>
      <th>版本</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>
    ${APPS.map(a => `<tr>
      <td data-l="应用标识"><span class="mono">${esc(a.app_id)}</span></td>
      <td data-l="名称"><b>${esc(a.name)}</b></td>
      <td data-l="卡密">共 ${a.card_total} · 未用 ${a.card_unused}</td>
      <td data-l="卡类型">${a.type_total} 种</td>
      <td data-l="版本">v${esc(a.version || '1.0.0')}</td>
      <td data-l="状态">${a.enabled ? '<span class="tag ok">启用</span>' : '<span class="tag off">停用</span>'}</td>
      <td data-l="操作" style="white-space:nowrap">
        <button class="btn ghost sm" onclick="appEdit('${esc(a.app_id)}')">编辑</button>
        <button class="btn ghost sm" onclick="appSecret('${esc(a.app_id)}')">密钥</button>
        <button class="btn ghost sm" onclick="go('gen')">生成卡</button>
        ${a.app_id === 'default' ? '' : `<button class="btn ghost sm" onclick="appDel('${esc(a.app_id)}')">删除</button>`}
      </td></tr>`).join('')}
    </tbody></table>`;
}

function appEdit(appId) {
  const a = appId ? APPS.find(x => x.app_id === appId) : { app_id: '', name: '', version: '1.0.0', download_url: '', notice: '', enabled: 1, remark: '' };
  openModal(appId ? '编辑应用 · ' + a.name : '新增应用', `
    <div class="f"><label>应用标识（客户端对接用，创建后不可改）</label>
      <input id="faId" value="${esc(a.app_id)}" ${appId ? 'disabled' : ''} placeholder="如 mytool、game1"></div>
    <div class="f"><label>应用名称</label>
      <input id="faName" value="${esc(a.name)}" placeholder="如 XX助手"></div>
    <div class="f"><label>客户端版本号</label>
      <input id="faVer" value="${esc(a.version || '1.0.0')}" placeholder="1.0.0"></div>
    <div class="f"><label>客户端下载地址</label>
      <input id="faUrl" value="${esc(a.download_url || '')}" placeholder="https://..."></div>
    <div class="f"><label>应用公告（客户端可拉取显示）</label>
      <textarea id="faNotice" rows="3">${esc(a.notice || '')}</textarea></div>
    ${appId ? `<div class="f"><label>状态</label><select id="faEnabled">
        <option value="1" ${a.enabled ? 'selected' : ''}>启用</option>
        <option value="0" ${!a.enabled ? 'selected' : ''}>停用</option></select></div>` : ''}
    <div class="f"><label>备注</label><input id="faRemark" value="${esc(a.remark || '')}"></div>
  `, `<button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="faSave">${appId ? '保存' : '创建'}</button>`);

  $('#faSave').onclick = async () => {
    try {
      if (appId) {
        await req('/api/admin/apps/' + appId, { method: 'PUT', body: {
          name: $('#faName').value.trim(),
          version: $('#faVer').value.trim(),
          download_url: $('#faUrl').value.trim(),
          notice: $('#faNotice').value,
          remark: $('#faRemark').value.trim(),
          enabled: $('#faEnabled') ? parseInt($('#faEnabled').value, 10) : 1,
        }});
      } else {
        const r = await req('/api/admin/apps', { body: {
          app_id: $('#faId').value.trim(),
          name: $('#faName').value.trim(),
          version: $('#faVer').value.trim(),
          download_url: $('#faUrl').value.trim(),
          notice: $('#faNotice').value,
          remark: $('#faRemark').value.trim(),
        }});
        alert('应用创建成功！\\n\\n应用标识：' + r.app_id
          + '\\n通信密钥：' + r.secret
          + '\\n\\n请把这个应用标识和密钥填到对应软件的客户端代码里。');
      }
      toast('已保存', 'ok'); closeModal(); go('apps');
    } catch (e) {}
  };
}

async function appSecret(appId) {
  const j = await req('/api/admin/apps');
  const a = j.list.find(x => x.app_id === appId);
  if (!a) return;
  openModal('应用密钥 · ' + a.name, `
    <div class="f"><label>应用标识 app_id</label>
      <input value="${esc(a.app_id)}" readonly></div>
    <div class="f"><label>通信密钥 secret</label>
      <input value="${esc(a.secret)}" readonly style="font-family:ui-monospace,monospace;font-size:12px"></div>
    <div class="hint">客户端签名要用这个密钥。重置后该应用的所有旧客户端会立即失效。</div>

/* 勾选逻辑（卡密列表） */
function bindCardCheckbox() {
  const all = $('#cardCheckAll');
  const box = $('#cardSelBar');

  function refresh() {
    const checked = $A('.card-chk:checked');
    const n = checked.length;
    if (box) {
      box.style.display = n > 0 ? 'flex' : 'none';
      $('#cardSelCount').textContent = n;
    }
    if (all) {
      const total = $A('.card-chk').length;
      all.checked = n > 0 && n === total;
      all.indeterminate = n > 0 && n < total;
    }
  }

  if (all) all.onchange = () => {
    $A('.card-chk').forEach(c => { c.checked = all.checked; });
    refresh();
  };
  $A('.card-chk').forEach(c => c.onchange = refresh);

  const getSel = () => $A('.card-chk:checked').map(c => c.value);

  const copyBtn = $('#cardSelCopy');
  if (copyBtn) copyBtn.onclick = () => {
    const sel = getSel();
    if (!sel.length) return toast('请先勾选卡密', 'err');
    copy(sel.join('\n'));
  };

  const dlBtn = $('#cardSelDl');
  if (dlBtn) dlBtn.onclick = () => {
    const sel = getSel();
    if (!sel.length) return toast('请先勾选卡密', 'err');
    download(`选中卡密_${sel.length}张_${Date.now()}.txt`, sel.join('\r\n'));
  };

  const disBtn = $('#cardSelDisable');
  if (disBtn) disBtn.onclick = async () => {
    const sel = getSel();
    if (!sel.length) return toast('请先勾选卡密', 'err');
    if (!confirm(`确定封禁选中的 ${sel.length} 张卡？封禁后用户无法使用。`)) return;
    let ok = 0;
    for (const k of sel) {
      try {
        const row = $A('.card-chk').find(c => c.value === k);
        const tr = row && row.closest('tr');
        const btn = tr && tr.querySelector('button[onclick*="disable"]');
        const m = btn && btn.getAttribute('onclick').match(/cardAct\((\d+)/);
        if (m) {
          await req('/api/admin/cards/' + m[1] + '/disable', { method: 'POST' });
          ok++;
        }
      } catch (e) {}
    }
    toast(`已封禁 ${ok} 张`, 'ok');
    loadCards();
  };

  const clrBtn = $('#cardSelClear');
  if (clrBtn) clrBtn.onclick = () => {
    $A('.card-chk').forEach(c => { c.checked = false; });
    refresh();
  };
}

function cardPage(p) { cardQ.page = p; loadCards(); }

async function cardAct(id, act) {
  try {
    if (act === 'extend') {
      const d = prompt('延长天数（可输负数缩短）：', '30');
      if (!d) return;
      const j = await req(`/api/admin/cards/${id}/extend`, { body: { days: parseInt(d, 10) } });
      toast(j.msg, 'ok');
    } else if (act === 'reset') {
      if (!confirm('重置后该卡恢复为未使用状态，已绑设备解绑，确定？')) return;
      const j = await req(`/api/admin/cards/${id}/reset`, { method: 'POST' });
      toast(j.msg, 'ok');
    } else {
      const j = await req(`/api/admin/cards/${id}/${act}`, { method: 'POST' });
      toast(j.msg, 'ok');
    }
    loadCards();
  } catch (e) {}
}

  let CURRENT_UNIT = 'credit';
  let TYPE_MAP = {};

  /* ---------- 生成区逻辑 ---------- */
  async function refreshTypes() {
    const appId = $('#cApp').value;
    const r = await req('/api/admin/types?app_id=' + encodeURIComponent(appId));
    const list = r.list.filter(t => t.unit === 'credit');
    TYPE_MAP = {};
    list.forEach(t => { TYPE_MAP[t.code] = t; });

    if (!list.length) {
      $('#cType').innerHTML = '<option value="">（该应用暂无额度卡类型）</option>';
      $('#cBtn').disabled = true;
      return;
    }
    $('#cBtn').disabled = false;
    $('#cType').innerHTML = list.map(t =>
      `<option value="${esc(t.code)}" data-unit="credit">${esc(t.name)}</option>`
    ).join('');
    onTypeChange();
  }

  function onTypeChange() {
    const opt = $('#cType').selectedOptions[0];
    if (!opt || !opt.value) return;
    CURRENT_UNIT = opt.dataset.unit || 'credit';
    $('#cUnitLabel').textContent = CURRENT_UNIT === 'credit' ? '额度' : '次数';
    updateTotal();
  }

  window.updateTotal = function () {
    const v = parseInt($('#cValue').value, 10) || 0;
    const n = parseInt($('#cCount').value, 10) || 0;
    const u = CURRENT_UNIT === 'credit' ? '额度' : '次';
    $('#cTotal').textContent = v;
    $('#cTotalUnit').textContent = `${u} × ${n} 张`;
  };

  $('#cApp').onchange = refreshTypes;
  $('#cType').onchange = onTypeChange;
  $('#cValue').oninput = () => updateTotal();
  $('#cCount').oninput = () => updateTotal();
  await refreshTypes();

  $('#cBtn').onclick = async () => {
    const app_id = $('#cApp').value;
    const type_code = $('#cType').value;
    const type_value = parseInt($('#cValue').value, 10);
    const count = parseInt($('#cCount').value, 10) || 1;

    if (!type_code) return toast('请先选择卡类型', 'err');
    if (!type_value || type_value <= 0) return toast('请填写大于 0 的面值', 'err');

    $('#cBtn').disabled = true;
    $('#cBtn').textContent = '生成中...';
    try {
      const r = await req('/api/admin/cards/generate', {
        body: {
          app_id, type_code, type_value, count,
          max_devices: parseInt($('#cDev').value, 10) || 1,
          remark: $('#cRemark').value.trim(),
        },
      });
      $('#cOutWrap').style.display = '';
      $('#cOut').value = r.cards.join('\n');
      const u = r.unit === 'credit' ? '额度' : '次';
      $('#cInfo').textContent = `批次 ${r.batch} · ${r.count} 张 · 每张 ${r.face_value} ${u}`;
      toast(r.msg || `成功生成 ${r.count} 张`, 'ok');
      loadCreditCards();
    } catch (e) {
      toast(e.message || '生成失败', 'err');
    } finally {
      $('#cBtn').disabled = false;
      $('#cBtn').textContent = '立即生成';
    }
  };

  $('#cCopy').onclick = () => $('#cOut').value && copy($('#cOut').value);
  $('#cDl').onclick = () => {
    if (!$('#cOut').value) return toast('还没有生成卡密', 'err');
    download(`额度卡_${$('#cValue').value}额度_${Date.now()}.txt`, $('#cOut').value);
  };

  /* ---------- 列表区逻辑 ---------- */
  $('#creStatus').value = creQ.status;
  $('#creApp').value = creQ.app_id;
  $('#creKw').value = creQ.kw;
  $('#creSearch').onclick = () => {
    creQ.app_id = $('#creApp').value;
    creQ.status = $('#creStatus').value;
    creQ.kw = $('#creKw').value.trim();
    creQ.page = 1;
    loadCreditCards();
  };
  $('#creApp').onchange = () => { creQ.app_id = $('#creApp').value; creQ.page = 1; loadCreditCards(); };
  $('#creStatus').onchange = () => { creQ.status = $('#creStatus').value; creQ.page = 1; loadCreditCards(); };
  $('#creKw').onkeydown = e => { if (e.key === 'Enter') $('#creSearch').click(); };

  loadCreditCards();
};

async function loadCreditCards() {
  // 只查额度卡/次数卡，不查时长卡
  const p = new URLSearchParams({
    page: creQ.page, size: 20, kw: creQ.kw,
    status: creQ.status, app_id: creQ.app_id,
    unit: creQ.unitFilter || '',
  });
  // 分别查额度卡和次数卡（分两次请求后合并，或后端支持多值）
  const [creditRes, countRes] = await Promise.all([
    req('/api/admin/cards?' + new URLSearchParams({
      page: 1, size: 500, kw: creQ.kw, status: creQ.status,
      app_id: creQ.app_id, unit: 'credit',
    })),
    req('/api/admin/cards?' + new URLSearchParams({
      page: 1, size: 500, kw: creQ.kw, status: creQ.status,
      app_id: creQ.app_id, unit: 'count',
    })),
  ]);

  let all = [...(creditRes.list || []), ...(countRes.list || [])];
  // 按 app_id 名称映射
  all.sort((a, b) => b.id - a.id);

  const total = all.length;
  const start = (creQ.page - 1) * 20;
  const pageList = all.slice(start, start + 20);

  $('#creTotal').textContent = `共 ${total} 张`;
  const box = $('#creTb');
  if (!pageList.length) {
    box.innerHTML = '<div class="empty">还没有额度卡，用上方的表单生成</div>';
    $('#crePg').innerHTML = '';
    return;
  }

  box.innerHTML = `<table class="tb tb-mobile">
    <thead><tr>
      <th style="width:38px"><input type="checkbox" id="creCheckAll"
        style="width:16px;height:16px;cursor:pointer" title="全选本页"></th>
      <th>卡密</th><th>面值</th><th>应用</th><th>类型</th><th>状态</th>
      <th>绑定设备</th><th>来源</th><th>创建时间</th><th>操作</th>
    </tr></thead><tbody>
    ${pageList.map(c => `<tr>
      <td data-l="选择"><input type="checkbox" class="cre-chk"
        value="${esc(c.card_key)}" style="width:16px;height:16px;cursor:pointer"></td>
      <td data-l="卡密"><span class="mono">${esc(c.card_key)}</span>
        <button class="btn ghost sm" style="padding:1px 7px;margin-left:4px"
          onclick="copy('${esc(c.card_key)}')">复制</button></td>
      <td data-l="面值"><b style="color:var(--brand);font-size:15px">${c.value}</b>
        <span style="color:var(--dim);font-size:12px">额度</span></td>
      <td data-l="应用"><span class="tag p">${esc(c.app_name || c.app_id)}</span></td>
      <td data-l="类型">${esc(c.type_name)}</td>
      <td data-l="状态">${statusTag(c.status)}</td>
      <td data-l="设备" class="mono" style="font-size:11.5px">
        ${c.owner_device ? esc(c.owner_device.slice(0, 16)) : '-'}</td>
      <td data-l="来源">${c.agent_name ? esc(c.agent_name) : '管理员'}</td>
      <td data-l="创建">${fmtTime(c.created_at)}</td>
      <td data-l="操作" style="white-space:nowrap">
        <button class="btn ghost sm" onclick="creditAct(${c.id},'disable')">
          ${c.status === 'disabled' ? '解封' : '封禁'}</button>
        <button class="btn ghost sm" onclick="creditAct(${c.id},'reset')">重置</button>
        <button class="btn ghost sm" onclick="creditAct(${c.id},'del')">删除</button>
      </td></tr>`).join('')}
    </tbody></table>`;

  bindCreditCheckbox();

  const pages = Math.ceil(total / 20);
  $('#crePg').innerHTML = `<span>第 ${creQ.page} / ${pages || 1} 页，共 ${total} 张</span>
    <button ${creQ.page <= 1 ? 'disabled' : ''} onclick="creditPage(${creQ.page - 1})">上一页</button>
    <button ${creQ.page >= pages ? 'disabled' : ''} onclick="creditPage(${creQ.page + 1})">下一页</button>`;
}

/* 勾选逻辑（额度卡列表） */
function bindCreditCheckbox() {
  const all = $('#creCheckAll');
  const bar = $('#creSelBar');
  if (!all) return;

  function refresh() {
    const n = $A('.cre-chk:checked').length;
    if (bar) {
      bar.style.display = n > 0 ? 'flex' : 'none';
      $('#creSelCount').textContent = n;
    }
    const total = $A('.cre-chk').length;
    all.checked = n > 0 && n === total;
    all.indeterminate = n > 0 && n < total;
  }

  all.onchange = () => {
    $A('.cre-chk').forEach(c => { c.checked = all.checked; });
    refresh();
  };
  $A('.cre-chk').forEach(c => c.onchange = refresh);

  const getSel = () => $A('.cre-chk:checked').map(c => c.value);

  $('#creSelCopy').onclick = () => {
    const sel = getSel();
    if (!sel.length) return toast('请先勾选', 'err');
    copy(sel.join('\n'));
  };
  $('#creSelDl').onclick = () => {
    const sel = getSel();
    if (!sel.length) return toast('请先勾选', 'err');
    download(`额度卡_${sel.length}张_${Date.now()}.txt`, sel.join('\r\n'));
  };
  $('#creSelClear').onclick = () => {
    $A('.cre-chk').forEach(c => { c.checked = false; });
    refresh();
  };
}

function creditPage(p) { creQ.page = p; loadCreditCards(); }

async function creditAct(id, act) {
  try {
    if (act === 'del') {
      if (!confirm('删除后不可恢复，确定删除这张卡？')) return;
      await req('/api/admin/cards/' + id, { method: 'DELETE' });
      toast('已删除', 'ok');
    } else {
      const j = await req(`/api/admin/cards/${id}/${act}`, { method: 'POST' });
      toast(j.msg, 'ok');
    }
    loadCreditCards();
  } catch (e) {}
}

async function loadTypesPanel() {
  const r = await req('/api/admin/types?app_id=' + encodeURIComponent(TYPE_APP));
  TYPE_LIST = r.list;
  TYPES = r.list;

  // 时长卡 = 小时卡 + 天卡，小时卡排在前面
  const time = r.list.filter(t => t.unit === 'hour' || t.unit === 'day')
    .sort((a, b) => {
      const order = u => (u === 'hour' ? 0 : 1);
      return order(a.unit) - order(b.unit) || a.sort - b.sort;
    });
  const credit = r.list.filter(t => t.unit === 'credit');

  const row = (t) => `<tr>
    <td data-l="代码"><span class="mono">${esc(t.code)}</span></td>
    <td data-l="名称">${esc(t.name)}</td>
    <td data-l="单位">${t.unit === 'hour' ? '<span class="tag wait">小时</span>' : '<span class="tag p">天</span>'}</td>
    <td data-l="面值">${t.unit === 'credit'
      ? '<span class="tag wait">生成时手填</span>'
      : (t.value > 0 ? t.value + (t.unit === 'hour' ? ' 小时' : ' 天')
                     : '<span style="color:var(--warn)">未设置</span>')}</td>
    <td data-l="状态">${t.enabled ? '<span class="tag ok">启用</span>' : '<span class="tag off">停用</span>'}</td>
    <td data-l="排序">${t.sort}</td>
    <td data-l="操作" style="white-space:nowrap">
      <button class="btn ghost sm" onclick="typeEdit(${t.id})">编辑</button>
      <button class="btn ghost sm" onclick="typeToggle(${t.id},${t.enabled ? 0 : 1})">${t.enabled ? '停用' : '启用'}</button>
      <button class="btn ghost sm" onclick="typeDel(${t.id})">删除</button>
    </td></tr>`;

  const headTime = `<table class="tb tb-mobile"><thead><tr>
    <th>代码</th><th>名称</th><th>单位</th><th>面值</th><th>状态</th><th>排序</th><th>操作</th>
  </tr></thead><tbody>`;
  const headCredit = `<table class="tb tb-mobile"><thead><tr>
    <th>代码</th><th>名称</th><th>单位</th><th>面值</th><th>状态</th><th>排序</th><th>操作</th>
  </tr></thead><tbody>`;

  $('#dayTb').innerHTML = time.length
    ? headTime + time.map(t => row(t)).join('') + '</tbody></table>'
    : '<div class="empty">还没有时长卡，点上方「新增时长卡」创建</div>';

  $('#creditTb').innerHTML = credit.length
    ? headCredit + credit.map(t => row(t)).join('') + '</tbody></table>'
    : '<div class="empty">还没有额度卡，点上方「新增额度卡」创建</div>';
}

async function typeEdit(id, defaultUnit) {
  const t = id
    ? TYPE_LIST.find(x => x.id === id)
    : { code: '', name: '', unit: (defaultUnit || 'day'), value: defaultUnit === 'credit' ? 0 : 1, sort: 100, remark: '', enabled: 1 };
  const unit = id ? t.unit : (defaultUnit || 'day');
  const titleMap = { hour: '新增时长卡', day: '新增时长卡', credit: '新增额度卡' };

  openModal(id ? '编辑卡类型' : (titleMap[unit] || '新增卡类型'), `
    <div class="f"><label>类型代码（英文，同应用内唯一）</label>
      <input id="ftCode" value="${esc(t.code)}" ${id ? 'disabled' : ''} placeholder="如 hour6"></div>
    <div class="f"><label>显示名称</label>
      <input id="ftName" value="${esc(t.name)}" placeholder="${unit === 'credit' ? '如 额度卡' : '如 6小时卡 / 月卡'}"></div>
    <div class="f"><label>计费方式</label>
      <select id="ftUnit" ${id ? 'disabled' : ''}>
        <option value="hour" ${unit === 'hour' ? 'selected' : ''}>小时卡（按小时累加）</option>
        <option value="day" ${unit === 'day' ? 'selected' : ''}>天卡（按天累加）</option>
        <option value="credit" ${unit === 'credit' ? 'selected' : ''}>额度卡（充值额度）</option>
      </select></div>
    <div class="f"><label id="ftValueLabel">${unit === 'hour' ? '时长（小时）' : unit === 'day' ? '时长（天）' : '默认面值（可留空）'}</label>
      <input id="ftValue" type="number" value="${t.value || ''}"
        placeholder="${unit === 'hour' ? '如 6' : unit === 'day' ? '如 30' : '留空则在生成时手动填写'}"></div>
    <div class="f"><label>排序（小的在前）</label><input id="ftSort" type="number" value="${t.sort}"></div>
    <div class="f"><label>备注</label><input id="ftRemark" value="${esc(t.remark || '')}"></div>
  `, `<button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="ftSave">保存</button>`);

  const unitSel = $('#ftUnit');
  if (unitSel) unitSel.onchange = () => {
    const u = unitSel.value;
    if (u === 'hour') {
      $('#ftValueLabel').textContent = '时长（小时）';
      $('#ftValue').placeholder = '如 6';
    } else if (u === 'day') {
      $('#ftValueLabel').textContent = '时长（天）';
      $('#ftValue').placeholder = '如 30';
    } else {
      $('#ftValueLabel').textContent = '默认面值（可留空）';
      $('#ftValue').placeholder = '留空则在生成时手动填写';
    }
  };

  $('#ftSave').onclick = async () => {
    const body = {
      app_id: TYPE_APP,
      code: $('#ftCode').value.trim(),
      name: $('#ftName').value.trim(),
      unit: $('#ftUnit').value,
      value: parseInt($('#ftValue').value, 10) || 0,
      sort: parseInt($('#ftSort').value, 10) || 100,
      remark: $('#ftRemark').value.trim(),
      enabled: t.enabled,
    };
    if (!body.code || !body.name) return toast('代码和名称必填', 'err');
    try {
      if (id) await req('/api/admin/types/' + id, { method: 'PUT', body });
      else await req('/api/admin/types', { body });
      toast('已保存', 'ok'); closeModal(); loadTypesPanel();
    } catch (e) {}
  };
}

async function typeToggle(id, en) {
  const t = TYPE_LIST.find(x => x.id === id);

async function agentEdit(id) {
  let a = { username: '', password: '', nickname: '', contact: '', level: 1, balance: 0 };
  if (id) {
    const j = await req('/api/admin/agents?size=500');
    a = j.list.find(x => x.id === id) || a;
  }
  openModal(id ? '编辑代理 · ' + a.username : '新增代理', `
    ${id ? '' : `<div class="f"><label>登录账号</label><input id="faUser" placeholder="字母数字下划线"></div>
    <div class="f"><label>登录密码</label><input id="faPwd" placeholder="至少6位"></div>`}
    <div class="f"><label>昵称</label><input id="faNick" value="${esc(a.nickname || '')}"></div>
    <div class="f"><label>联系方式（QQ/微信）</label><input id="faContact" value="${esc(a.contact || '')}"></div>
    <div class="f"><label>等级</label><select id="faLevel">
      <option value="1" ${a.level == 1 ? 'selected' : ''}>普通代理</option>
      <option value="2" ${a.level == 2 ? 'selected' : ''}>银牌代理</option>
      <option value="3" ${a.level == 3 ? 'selected' : ''}>金牌代理</option>
      <option value="4" ${a.level == 4 ? 'selected' : ''}>总代理</option>
    </select></div>
    ${id ? `<div class="f"><label>冻结</label><select id="faFrozen">
      <option value="0" ${!a.frozen ? 'selected' : ''}>正常</option>
      <option value="1" ${a.frozen ? 'selected' : ''}>冻结</option></select></div>`
    : `<div class="f"><label>初始余额 ¥</label><input id="faBal" type="number" step="0.01" value="0"></div>`}
  `, `<button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="faSave">保存</button>`);

  $('#faSave').onclick = async () => {
    try {
      if (id) {
        await req('/api/admin/agents/' + id, { method: 'PUT', body: {
          nickname: $('#faNick').value, contact: $('#faContact').value,
          level: parseInt($('#faLevel').value, 10),
          frozen: parseInt($('#faFrozen').value, 10),
        }});
      } else {
        const j = await req('/api/admin/agents', { body: {
          username: $('#faUser').value.trim(), password: $('#faPwd').value,
          nickname: $('#faNick').value, contact: $('#faContact').value,
          level: parseInt($('#faLevel').value, 10),
          balance: parseFloat($('#faBal').value) || 0,
        }});
        alert('代理创建成功！\n\nAPI 密钥（请保存给代理）：\n' + j.api_key);
      }
      toast('已保存', 'ok'); closeModal(); loadAgents();
    } catch (e) {}
  };
}

function agentBal(id) {
  openModal('调整代理余额', `
    <div class="f"><label>变动金额（正=加款，负=扣款）</label><input id="fbDelta" type="number" step="0.01" value="100"></div>
  `, `<button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="fbSave">确认</button>`);
  $('#fbSave').onclick = async () => {
    try {
      const j = await req(`/api/admin/agents/${id}/balance`, {
        body: { delta: parseFloat($('#fbDelta').value) }
      });
      toast(j.msg, 'ok'); closeModal(); loadAgents();
    } catch (e) {}
  };
}

async function agentPwd(id) {
  const p = prompt('输入新密码（至少6位）：', '123456');
  if (!p) return;
  const j = await req(`/api/admin/agents/${id}/resetpwd`, { body: { password: p } });
  toast(j.msg, 'ok');
}
async function agentDel(id) {
  if (!confirm('删除代理不会删除其已生成的卡密，确定？')) return;
  await req('/api/admin/agents/' + id, { method: 'DELETE' });
  toast('已删除', 'ok'); loadAgents();
}

async function loadLogs() {
  const p = new URLSearchParams({
    page: logQ.page, size: 30, kw: logQ.kw, action: logQ.action, onlyFail: logQ.onlyFail
  });
  const d = await req('/api/admin/logs?' + p);
  $('#logTotal').textContent = `共 ${d.total} 条`;
  const box = $('#logTb');
  if (!d.list.length) { box.innerHTML = '<div class="empty">暂无日志</div>'; $('#logPg').innerHTML = ''; return; }
  box.innerHTML = `<table class="tb tb-mobile">
    <thead><tr><th>时间</th><th>动作</th><th>卡密</th><th>机器码</th><th>IP</th><th>结果</th><th>说明</th></tr></thead>
    <tbody>${d.list.map(r => `<tr>
      <td data-l="时间" style="white-space:nowrap;font-size:12px">${esc(r.time_text)}</td>
      <td data-l="动作"><span class="tag wait">${esc(r.action)}</span></td>
      <td data-l="卡密" class="mono" style="font-size:11.5px">${esc(r.card_key || '-')}</td>
      <td data-l="机器码" class="mono" style="font-size:11px">${esc((r.device_id || '-').slice(0, 20))}</td>
      <td data-l="IP" style="font-size:12px">${esc(r.ip || '-')}</td>
      <td data-l="结果">${r.ok ? '<span class="tag ok">成功</span>' : '<span class="tag err">失败</span>'}</td>
      <td data-l="说明" style="font-size:12px">${esc(r.msg || '')}</td></tr>`).join('')}</tbody></table>`;
  const pages = Math.ceil(d.total / 30);
  $('#logPg').innerHTML = `<span>第 ${d.page} / ${pages || 1} 页</span>
    <button ${d.page <= 1 ? 'disabled' : ''} onclick="logPage(${d.page - 1})">上一页</button>
    <button ${d.page >= pages ? 'disabled' : ''} onclick="logPage(${d.page + 1})">下一页</button>`;
}
function logPage(p) { logQ.page = p; loadLogs(); }

## 一、验证流程

\`\`\`
用户启动软件
   ↓
输入卡密 → 调 /api/client/verify
   ↓
   ├─ code=0      验证通过 → 进入软件
   ├─ code=2005   卡未激活 → 调 /api/client/activate 激活后再进
   ├─ code=2004   已过期   → 提示续费
   ├─ code=2007   设备超限 → 提示联系客服解绑
   └─ 其他        失败     → 提示错误并退出
   ↓
进入软件后每 5 分钟调 /api/client/heartbeat 保活
   ↓
心跳连续失败 3 次 → 锁定功能
\`\`\`

**关键点：不要只在启动时验证一次。** 破解者通常在启动后补丁跳过验证，
所以要在关键功能执行前（保存、导出、执行核心操作）再校验一次内存标志位。

## 二、签名规则（必须实现）

每个请求都要带 \`sign\` / \`timestamp\` / \`nonce\`：

\`\`\`
timestamp = 当前 Unix 毫秒时间戳（13 位）
nonce     = 16 位随机字符串
bodyJson  = 请求体去掉 sign/timestamp/nonce/card_key/device_id 后，按 key 字母升序的紧凑 JSON
payload   = card_key + "|" + device_id + "|" + timestamp + "|" + nonce + "|" + bodyJson
sign      = HMAC_SHA256(secret, payload) 的十六进制小写
\`\`\`

时间偏差超过 5 分钟会被拒（1004），nonce 重复会被拒（1003）。

\`\`\`python
import json, time, hmac, hashlib, uuid, os, platform, hashlib
import requests

BASE      = "${BASE}"
SECRET    = "${SECRET}"
APP_ID    = "${appId}"

class CardAuth:
    def __init__(self, card_key, device_id=None):
        self.card_key  = (card_key or "").strip().upper()
        self.machine   = device_id or self.gen_machine_code()
        self.session   = requests.Session()

    @staticmethod
    def gen_machine_code():
        """机器码：同一台机器每次必须算出相同值，否则会被判定换机"""
        import subprocess
        parts = []
        if platform.system() == "Windows":
            try:
                out = subprocess.check_output(
                    ["powershell", "-NoProfile", "-Command",
                     "(Get-CimInstance Win32_ComputerSystemProduct).UUID"],
                    stderr=subprocess.DEVNULL, timeout=8
                ).decode(errors="ignore").strip()
                if out and out != "FFFFFFFF-FFFF-FFFF-FFFF-FFFFFFFFFFFF":
                    parts.append(out)
            except Exception:
                pass
        else:
            for f in ("/etc/machine-id", "/var/lib/dbus/machine-id"):
                if os.path.exists(f):
                    parts.append(open(f).read().strip()); break
        parts += [platform.node(), platform.machine()]
        raw = "|".join(p for p in parts if p)
        return hashlib.md5(raw.encode()).hexdigest().upper()

    def _post(self, path, data=None):
        body    = dict(data or {})
        ts      = str(int(time.time() * 1000))
        nonce   = uuid.uuid4().hex
        clean   = {k: v for k, v in body.items()
                   if k not in ("sign", "timestamp", "nonce", "card_key", "device_id")}
        body_js = json.dumps(clean, separators=(",", ":"), sort_keys=True)
        payload = "|".join([self.card_key, self.machine, ts, nonce, body_js])
        sign    = hmac.new(SECRET.encode(), payload.encode(), hashlib.sha256).hexdigest()

        body.update({
            "card_key": self.card_key, "device_id": self.machine,
            "timestamp": ts, "nonce": nonce, "sign": sign,
        })
        r = self.session.post(BASE + path, json=body, timeout=10)
        return r.json()

    # ---- 业务 ----
    def activate(self):   return self._post("/api/client/activate")
    def verify(self):     return self._post("/api/client/verify")
    def heartbeat(self):  return self._post("/api/client/heartbeat")
    def info(self):       return self._post("/api/client/info")

    def login(self):
        """一步登录：验证 → 未激活自动激活"""
        r = self.verify()
        if r.get("code") == 2005:
            r = self.activate()
        return r


# ========= 使用示例 =========
def main():
    key = input("请输入卡密: ").strip()
    auth = CardAuth(key)
    print("机器码:", auth.machine)

    r = auth.login()
    if r["code"] != 0:
        print(f"验证失败 [{r['code']}]: {r['msg']}")
        return

    card = r["card"]
    user = card["user"]
    print(f"登录成功  类型={card['type_name']}")
    if card["unit"] == "day":
        print(f"  剩余 {user['remain_days']} 天，到期 {user['expire_at_text']}")
    else:
        print(f"  剩余额度 {user['credit']}")

    # 心跳（实际项目用独立线程）
    import threading, time as _t
    def hb():
        fail = 0
        while True:
            _t.sleep(300)
            res = auth.heartbeat()
            fail = 0 if res["code"] == 0 else fail + 1
            if fail >= 3:
                print("验证掉线，锁定功能"); os._exit(1)
    threading.Thread(target=hb, daemon=True).start()

    # ---- 你的软件逻辑 ----
    print("软件已解锁，可以正常使用")
    input("按回车退出\\n")

if __name__ == "__main__":
    main()

\`\`\`csharp
using System;
using System.Collections.Generic;
using System.Linq;
using System.Net.Http;
using System.Security.Cryptography;
using System.Text;
using System.Text.Json;
using System.Text.Json.Nodes;
using System.Threading.Tasks;

public class CardAuth
{
    private const string Base   = "${BASE}";
    private const string Secret = "${SECRET}";
    private const string AppId  = "${appId}";

    private static readonly HttpClient Http = new HttpClient { Timeout = TimeSpan.FromSeconds(10) };

    public string CardKey  { get; set; }
    public string DeviceId { get; set; }
    public int    LastCode { get; private set; } = -1;
    public string LastMsg  { get; private set; } = "";

    public CardAuth(string cardKey, string deviceId = null)
    {
        CardKey  = (cardKey ?? "").Trim().ToUpperInvariant();
        DeviceId = deviceId ?? GenMachineCode();
    }

    public static string GenMachineCode()
    {
        string raw = "";
        try
        {
            using var s = new System.Management.ManagementObjectSearcher(
                "SELECT UUID FROM Win32_ComputerSystemProduct");
            foreach (var o in s.Get()) { raw = o["UUID"]?.ToString() ?? ""; if (raw != "") break; }
        }
        catch { }
        if (string.IsNullOrWhiteSpace(raw))
            raw = Environment.MachineName + "|" + Environment.UserName;
        using var md5 = MD5.Create();
        return BitConverter.ToString(md5.ComputeHash(Encoding.UTF8.GetBytes(raw)))
                           .Replace("-", "").ToUpperInvariant();
    }

    private static string Hmac(string key, string data)
    {
        using var h = new HMACSHA256(Encoding.UTF8.GetBytes(key));
        return BitConverter.ToString(h.ComputeHash(Encoding.UTF8.GetBytes(data)))
                           .Replace("-", "").ToLowerInvariant();
    }

    private static string NormalizeBody(IDictionary<string, object> d)
    {
        var skip = new[] { "sign", "timestamp", "nonce", "card_key", "device_id" };
        var sorted = new SortedDictionary<string, object>(StringComparer.Ordinal);
        foreach (var kv in d) if (!skip.Contains(kv.Key)) sorted[kv.Key] = kv.Value;
        var sb = new StringBuilder("{");
        bool first = true;
        foreach (var kv in sorted)
        {
            if (!first) sb.Append(',');
            first = false;
            sb.Append('"').Append(kv.Key).Append("\\":").Append(JsonSerializer.Serialize(kv.Value));
        }
        return sb.Append('}').ToString();
    }

    private async Task<JsonObject> Post(string path, IDictionary<string, object> data = null)
    {
        data ??= new Dictionary<string, object>();
        string ts    = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds().ToString();
        string nonce = Guid.NewGuid().ToString("N");
        string bj    = NormalizeBody(data);
        string sign  = Hmac(Secret, string.Join("|", CardKey, DeviceId, ts, nonce, bj));

        var final = new Dictionary<string, object>(data)
        {
            ["card_key"] = CardKey, ["device_id"] = DeviceId,
            ["timestamp"] = ts, ["nonce"] = nonce, ["sign"] = sign,
        };
        var content = new StringContent(JsonSerializer.Serialize(final), Encoding.UTF8, "application/json");
        var resp = await Http.PostAsync(Base + path, content);
        var text = await resp.Content.ReadAsStringAsync();
        var jo = JsonNode.Parse(text) as JsonObject;
        LastCode = jo?["code"]?.GetValue<int>() ?? -1;
        LastMsg  = jo?["msg"]?.GetValue<string>() ?? "";
        return jo;
    }

    public Task<JsonObject> Activate()  => Post("/api/client/activate");
    public Task<JsonObject> Verify()    => Post("/api/client/verify");
    public Task<JsonObject> Heartbeat() => Post("/api/client/heartbeat");
    public Task<JsonObject> Info()      => Post("/api/client/info");

    public async Task<(bool ok, JsonObject card, string err)> LoginAsync()
    {
        var r = await Verify();
        if (LastCode == 2005) r = await Activate();
        return LastCode == 0 ? (true, r?["card"] as JsonObject, "") : (false, null, LastMsg);
    }
}

## 七、服务端验证流程图（防破解要点）

| 阶段 | 做什么 | 为什么 |
|---|---|---|
| 启动 | \`/verify\` | 基础门槛 |
| 进入后 | 300 秒 \`/heartbeat\` | 掉线即锁，补丁跳过启动验证也没用 |
| 关键功能前 | 检查内存标志位 + 偶尔重新 \`/verify\` | 防"启动后打补丁" |
| 到期判断 | 只用服务端返回的 \`expire_at\` | 不信任本机时间 |
| 密钥存储 | 字符串拆分/异或混淆，运行时还原 | 反编译搜不到明文 |

import json, time, hmac, hashlib, uuid
import requests

BASE   = "${BASE}"
SECRET = "${SECRET}"
APP_ID = "${appId}"

class CreditAuth:
    def __init__(self, card_key, device_id):
        self.card_key = card_key.strip().upper()
        self.machine  = device_id
        self.s        = requests.Session()

    def _post(self, path, data=None):
        body  = dict(data or {})
        ts    = str(int(time.time() * 1000))
        nonce = uuid.uuid4().hex
        clean = {k: v for k, v in body.items()
                 if k not in ("sign", "timestamp", "nonce", "card_key", "device_id")}
        bj    = json.dumps(clean, separators=(",", ":"), sort_keys=True)
        sign  = hmac.new(SECRET.encode(),
                         "|".join([self.card_key, self.machine, ts, nonce, bj]).encode(),
                         hashlib.sha256).hexdigest()
        body.update({"card_key": self.card_key, "device_id": self.machine,
                     "timestamp": ts, "nonce": nonce, "sign": sign})
        return self.s.post(BASE + path, json=body, timeout=10).json()

    # ---- 账户 ----
    def info(self):
        """查余额：返回 card.user.credit"""
        return self._post("/api/client/info")

    def activate_credit_card(self):
        """用法A：把额度卡当账号激活"""
        return self._post("/api/client/activate")

    # ---- 充值 ----
    def recharge(self, credit_card_key):
        """用法B：用额度卡给人充值"""
        return self._post("/api/client/redeem", {
            "redeem_key": credit_card_key.strip().upper()
        })

    # ---- 扣费 ----
    def consume(self, amount, remark=""):
        return self._post("/api/client/consume", {
            "amount": int(amount), "remark": remark
        })

    # ---- 便捷：带余额检查的扣费 ----
    def charge_or_raise(self, amount, remark=""):
        r = self.consume(amount, remark)
        if r["code"] == 2008:
            raise RuntimeError(f"额度不足，当前 {r.get('balance', 0)}")
        if r["code"] != 0:
            raise RuntimeError(f"扣费失败: {r['msg']}")
        return r["balance"]

## 一、破解版接入的三种方式

### 方式 1：DLL 劫持注入（最通用）

把自己的验证 DLL 伪装成原软件依赖的某个系统 DLL，软件启动时自动加载你的验证逻辑。

**步骤：**

1. 用 Process Monitor / Dependency Walker 查原软件加载了哪些 DLL
2. 挑一个加载失败的（比如缺 \`version.dll\`、\`winmm.dll\`）
3. 自己编译同名 DLL，导出原 DLL 的所有函数（转发到系统同名 DLL）
4. 在 \`DllMain\` 的 \`DLL_PROCESS_ATTACH\` 里启动验证线程
5. 验证失败就 \`TerminateProcess\` 或让功能失效

**劫持 DLL 模板（C++）：**

\`\`\`cpp
// 伪装 version.dll
#include <windows.h>
#include <string>

// 转发到系统真实 DLL
#pragma comment(linker, "/export:GetFileVersionInfoA=C:\\\\Windows\\\\System32\\\\version.GetFileVersionInfoA")
#pragma comment(linker, "/export:GetFileVersionInfoW=C:\\\\Windows\\\\System32\\\\version.GetFileVersionInfoW")
#pragma comment(linker, "/export:GetFileVersionInfoSizeA=C:\\\\Windows\\\\System32\\\\version.GetFileVersionInfoSizeA")
#pragma comment(linker, "/export:GetFileVersionInfoSizeW=C:\\\\Windows\\\\System32\\\\version.GetFileVersionInfoSizeW")
#pragma comment(linker, "/export:VerQueryValueA=C:\\\\Windows\\\\System32\\\\version.VerQueryValueA")
#pragma comment(linker, "/export:VerQueryValueW=C:\\\\Windows\\\\System32\\\\version.VerQueryValueW")

DWORD WINAPI VerifyThread(LPVOID) {
    // 这里调用卡密验证接口
    if (!CardVerify()) {
        MessageBoxW(NULL, L"请先输入有效卡密", L"提示", MB_ICONERROR);
        // 直接结束宿主进程
        TerminateProcess(GetCurrentProcess(), 0);
    }
    return 0;
}

BOOL APIENTRY DllMain(HMODULE h, DWORD reason, LPVOID) {
    if (reason == DLL_PROCESS_ATTACH) {
        DisableThreadLibraryCalls(h);
        CreateThread(NULL, 0, VerifyThread, NULL, 0, NULL);
    }
    return TRUE;
}
\`\`\`

> 编译：\`cl /LD version.cpp\`，生成 \`version.dll\`，放到原软件目录。

### 方式 2：启动器模式（最安全，推荐）

不改原软件的 exe，而是自己写一个"启动器"。用户点启动器 → 验证卡密 → 通过后再启动目标程序。

**优点**：不碰原程序，不破坏数字签名，升级也方便。
**缺点**：用户能绕过启动器直接点原 exe，所以需要配合下面"进程监控"。

\`\`\`python
# 启动器示例
import subprocess, sys, psutil
from cardauth import CardAuth

TARGET = r"C:\\Program Files\\TargetApp\\app.exe"

def main():
    key = input("请输入卡密: ").strip()
    auth = CardAuth(key)
    r = auth.login()
    if r["code"] != 0:
        print("验证失败:", r["msg"]); sys.exit(1)

    print(f"验证通过，剩余 {r['card']['user'].get('remain_days', '无限')} 天")
    proc = subprocess.Popen([TARGET])

    # 监控进程，同时保持心跳
    import threading, time
    def heartbeat():
        fail = 0
        while proc.poll() is None:
            time.sleep(300)
            hb = auth.heartbeat()
            fail = 0 if hb["code"] == 0 else fail + 1
            if fail >= 3:
                proc.terminate()
                print("验证掉线，已关闭程序")
                return
    threading.Thread(target=heartbeat, daemon=True).start()
    proc.wait()

if __name__ == "__main__":
    main()
\`\`\`

### 方式 3：进程守护联动

启动器启动后，轮询系统进程，发现目标程序在跑但启动器不在（说明用户直接点原 exe），就干掉它。

\`\`\`python
import psutil, time, os

def guard(target_name="app.exe", launcher_pid=None):
    while True:
        time.sleep(2)
        for p in psutil.process_iter(["name", "pid"]):
            if p.info["name"] == target_name and p.info["pid"] != launcher_pid:
                # 检查是否有本启动器在运行
                if not has_launcher_running():
                    try: p.kill()
                    except: pass
\`\`\`

## 二、破解版接入的验证逻辑（关键）

破解版最怕的是**别人再破解你的破解版**。所以验证要更狠：

### 1. 内存标志位 + 多线程交叉校验

不要用一个全局变量 \`isVip\`，破解者一搜就找到。

\`\`\`cpp
// 不好的写法
bool g_verified = false;
if (g_verified) { DoWork(); }   // 破解者搜 g_verified，改成 true 就完事

// 好的写法：把验证结果藏进已有的数据结构，或者用多个变量交叉验证
struct License {
    int  checksum1;
    int  checksum2;
    long expireTime;
};
// 校验时同时检查 3 个值是否自洽，改一个就对不上
\`\`\`

### 2. 服务端下发关键数据

不要只让服务端返回"通过/不通过"，让服务端返回**业务必需的数据**（比如解密密钥、参数表）。
没通过验证拿不到这些数据，软件本身就是残缺的，补丁也没用。

### 3. 定期强制重新验证

不要只在启动时验证。每 5~10 分钟重新调 \`/verify\`，连续失败就退出。
破解者常用的"启动后打补丁"就失效了。

### 4. 密钥混淆

\`\`\`cpp
// 不要写明文
const char* SECRET = "abc123def456";

// 拆开 + 运行时还原
char s1[] = {0x61,0x62,0x63};           // abc
char s2[] = {0x31,0x32,0x33};           // 123
std::string secret = std::string(s1,3) + std::string(s2,3);
\`\`\`

### 5. 反调试

\`\`\`cpp
#include <windows.h>

bool AntiDebug() {
    if (IsDebuggerPresent()) return true;
    BOOL remote = FALSE;
    CheckRemoteDebuggerPresent(GetCurrentProcess(), &remote);
    if (remote) return true;

    // 检查 PEB.BeingDebugged
    #ifdef _WIN64
    auto peb = (PEB*)__readgsqword(0x60);
    #else
    auto peb = (PEB*)__readfsdword(0x30);
    #endif
    if (peb->BeingDebugged) return true;

    return false;
}
\`\`\`

检测到调试就拒绝运行，或触发验证失败分支。

// CardAuthDll.cpp — 注入到目标进程后的验证逻辑
#include <windows.h>

static std::string GetServer() { return "${BASE}"; }
static std::string GetSecret() { return "${SECRET}"; }

static std::string HmacSha256(const std::string& key, const std::string& data) {
    BCRYPT_ALG_HANDLE hAlg; BCRYPT_HASH_HANDLE hHash;
    DWORD cbHash = 0, cbData = 0;
    BCryptOpenAlgorithmProvider(&hAlg, BCRYPT_SHA256_ALGORITHM, NULL,
        BCRYPT_ALG_HANDLE_HMAC_FLAG);
    BCryptGetProperty(hAlg, BCRYPT_HASH_LENGTH, (PUCHAR)&cbHash,
        sizeof(cbHash), &cbData, 0);
    std::vector<BYTE> hash(cbHash);
    BCryptCreateHash(hAlg, &hHash, NULL, 0, (PUCHAR)key.c_str(),
        (ULONG)key.size(), 0);
    BCryptHashData(hHash, (PUCHAR)data.c_str(), (ULONG)data.size(), 0);
    BCryptFinishHash(hHash, hash.data(), cbHash, 0);
    std::string hex, tmp(3, 0);
    for (DWORD i = 0; i < cbHash; i++) {
        sprintf_s(&tmp[0], 3, "%02x", hash[i]);
        hex += tmp;
    }
    BCryptDestroyHash(hHash);
    BCryptCloseAlgorithmProvider(hAlg, 0);
    return hex;
}

    if (!f) return "";
    char buf[128] = {0};
    fread(buf, 1, 127, f);
    fclose(f);
    return buf;
}

## 六、常见问题

**Q: 注入后原软件崩溃？**
A: 多半是 DLL 导出函数没转发全。用 \`dumpbin /exports 原dll\` 看完整导出列表，
确保你的 DLL 导出了所有同名函数并转发到系统原 DLL。

**Q: 软件更新后注入失效？**
A: 更新可能改了 DLL 依赖列表。重新用 Process Monitor 看一眼，换一个被加载的 DLL 劫持。

**Q: 用户反映杀毒报毒？**
A: DLL 注入本身敏感。建议改用「启动器 + 进程守护」方式，或者给 DLL 申请数字签名。

**Q: 怎么防止别人拿你的破解版再破解？**
A: 核心是"服务端下发关键数据"，没验证就拿不到能用的数据。这比任何本地加密都有效。

import json, time, hmac, hashlib, uuid, requests

BASE   = "${BASE}"
SECRET = "${SECRET}"

def call(path, card_key, device_id, data=None):
    body  = dict(data or {})
    ts    = str(int(time.time() * 1000))
    nonce = uuid.uuid4().hex
    clean = {k: v for k, v in body.items()
             if k not in ("sign","timestamp","nonce","card_key","device_id")}
    bj    = json.dumps(clean, separators=(",", ":"), sort_keys=True)
    sign  = hmac.new(SECRET.encode(),
                     "|".join([card_key, device_id, ts, nonce, bj]).encode(),
                     hashlib.sha256).hexdigest()
    body.update({"card_key": card_key, "device_id": device_id,
                 "timestamp": ts, "nonce": nonce, "sign": sign})
    return requests.post(BASE + path, json=body, timeout=10).json()

| 9003 | 请求过于频繁 | 降频 |

### 卡密相关

| code | 含义 | 客户端处理 |
|---|---|---|
| 2001 | 卡密不存在 | 提示核对 |
| 2002 | 卡密已被使用 | 提示或引导激活 |
| 2003 | 卡密已被封禁 | 禁止使用 |
| 2004 | 卡密已过期 | 提示续费 |
| 2005 | 卡密未激活 | 调 activate |
| 2006 | 设备不匹配 | 提示联系客服 |
| 2007 | 绑定设备数超限 | 提示解绑 |
| 2008 | 额度不足 | 提示充值 |

## 四、签名算法参考实现

\`\`\`python
def sign_url(secret, card_key, device_id, body_json):
    ts    = str(int(time.time() * 1000))
    nonce = uuid.uuid4().hex
    payload = "|".join([card_key, device_id, ts, nonce, body_json])
    sign = hmac.new(secret.encode(), payload.encode(), hashlib.sha256).hexdigest()
    return ts, nonce, sign
\`\`\`

\`\`\`javascript
function signUrl(secret, cardKey, deviceId, bodyJson) {
  const crypto = require('crypto');
  const ts = Date.now().toString();
  const nonce = crypto.randomBytes(8).toString('hex');
  const payload = [cardKey, deviceId, ts, nonce, bodyJson].join('|');
  const sign = crypto.createHmac('sha256', secret).update(payload).digest('hex');
  return { ts, nonce, sign };
}
\`\`\`

\`\`\`csharp
public static (string ts, string nonce, string sign) Sign(
    string secret, string cardKey, string deviceId, string bodyJson)
{
    string ts = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds().ToString();
    string nonce = Guid.NewGuid().ToString("N");
    string payload = string.Join("|", cardKey, deviceId, ts, nonce, bodyJson);
    using var h = new HMACSHA256(Encoding.UTF8.GetBytes(secret));
    string sign = BitConverter.ToString(
        h.ComputeHash(Encoding.UTF8.GetBytes(payload))).Replace("-", "").ToLowerInvariant();
    return (ts, nonce, sign);
}

## 五、多应用说明

如果你有多个软件共用一个后台：

1. 后台「应用管理」→ 新增应用 → 每个软件一个 \`app_id\`
2. 每个应用有自己的 \`secret\`（在应用管理里点「密钥」查看）
3. 客户端对接时：
   - 用自己应用的 \`secret\` 做签名
   - 拉配置时带 \`?app_id=你的应用\`
4. 卡密在哪个应用生成就只能在该应用用，跨应用会返回 3001

**为什么要分应用？**
- 一个应用的密钥泄露不影响其他应用
- 各应用卡密池独立，好统计好管理
- 可以给不同应用设不同版本号、公告、下载地址
